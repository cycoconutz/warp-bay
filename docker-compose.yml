services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5123:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Provider: SqlServer
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=WarpBay;User Id=sa;Password=WarpBay123!;TrustServerCertificate=True"
      Jwt__Key: "warp-bay-demo-key-change-me-32chars-minimum!!"
      Demo__Enabled: "true"
      Swagger__Enabled: "true"
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "WarpBay123!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - warp-bay-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'WarpBay123!' -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  warp-bay-sql:
